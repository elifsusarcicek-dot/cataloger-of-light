<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cataloger of Light</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --surface: #0e1318;
    --surface2: #141b22;
    --border: #1e2d3d;
    --accent: #00b4d8;
    --accent2: #90e0ef;
    --text: #caf0f8;
    --text-dim: #4a7d96;
    --glow: rgba(0,180,216,0.15);
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    overflow-x: hidden;
  }

  /* Scanline effect */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  .container {
    width: 100%;
    max-width: 760px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 40px;
  }

  .system-tag {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
    display: block;
  }

  .title {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(20px, 4vw, 32px);
    color: var(--accent);
    text-shadow: 0 0 20px var(--glow);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-dim);
    font-weight: 300;
  }

  /* Group tracker */
  .tracker {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 24px;
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .tracker-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .word-slots {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .word-slot {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    transition: all 0.4s;
    min-width: 40px;
    text-align: center;
  }

  .word-slot.revealed {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--glow);
    text-shadow: 0 0 8px var(--accent);
  }

  /* Chat area */
  .chat-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 200px;
    max-height: 320px;
    overflow-y: auto;
    padding: 24px;
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .message {
    display: flex;
    flex-direction: column;
    gap: 4px;
    animation: fadeUp 0.4s ease;
  }

  .message-sender {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .message.user .message-sender { color: #4a9eff; }
  .message.cataloger .message-sender { color: var(--accent); }

  .message-text {
    font-size: 16px;
    line-height: 1.7;
    color: var(--text);
  }

  .message.user .message-text {
    color: #a8d4ff;
    font-style: italic;
  }

  .message-text .secret-word {
    color: var(--accent);
    font-weight: 700;
    text-shadow: 0 0 10px var(--glow);
    font-family: 'Share Tech Mono', monospace;
  }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 1px;
    margin: auto;
    line-height: 2;
  }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--accent);
    animation: blink 1s infinite;
    vertical-align: middle;
    margin-left: 2px;
  }

  /* Input area */
  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
  }

  .starter-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
    display: block;
  }

  .starters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .starter-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .starter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--glow);
  }

  .starter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--glow);
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .input-wrap {
    flex: 1;
  }

  .selected-starter {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--accent2);
    margin-bottom: 6px;
    min-height: 20px;
    transition: all 0.3s;
  }

  textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-bottom: 2px solid var(--accent);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 6px 6px 0 0;
    outline: none;
    resize: none;
    height: 54px;
    transition: all 0.2s;
    line-height: 1.5;
  }

  textarea:focus {
    background: #111a22;
    border-bottom-color: var(--accent2);
  }

  textarea::placeholder { color: var(--text-dim); }

  .send-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 0 20px;
    height: 54px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: var(--bg);
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 700;
    white-space: nowrap;
  }

  .send-btn:hover:not(:disabled) {
    background: var(--accent2);
    transform: translateY(-1px);
  }

  .send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Final reveal */
  .final-reveal {
    display: none;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 28px 32px;
    margin-top: 20px;
    text-align: center;
    box-shadow: 0 0 30px var(--glow);
    animation: fadeUp 0.6s ease;
  }

  .final-reveal.show { display: block; }

  .final-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .final-sentence {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(16px, 3vw, 24px);
    color: var(--accent);
    text-shadow: 0 0 20px var(--glow);
    letter-spacing: 1px;
    line-height: 1.6;
  }

  /* Reset */
  .reset-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 16px;
    display: block;
    margin-left: auto;
  }

  .reset-btn:hover {
    border-color: var(--text-dim);
    color: var(--text);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 10px var(--glow); }
    50% { text-shadow: 0 0 25px var(--accent), 0 0 50px var(--glow); }
  }
</style>
</head>
<body>

<div class="container">

  <header>
    <span class="system-tag">Unit 3 — Stage 4 — Digital Lab</span>
    <h1 class="title">THE CATALOGER OF LIGHT</h1>
    <p class="subtitle">Write to the Cataloger. It will respond. Listen carefully.</p>
  </header>

  <!-- Word tracker -->
  <div class="tracker">
    <span class="tracker-label">Collected Words</span>
    <div class="word-slots" id="wordSlots"></div>
  </div>

  <!-- Chat -->
  <div class="chat-area" id="chatArea">
    <div class="empty-state">
      SYSTEM ONLINE. AWAITING INPUT.<span class="cursor"></span>
    </div>
  </div>

  <!-- Input -->
  <div class="input-section">
    <span class="starter-label">Choose a sentence starter:</span>
    <div class="starters">
      <button class="starter-btn" onclick="selectStarter(this, 'If I were human, I would')">If I were human, I would...</button>
      <button class="starter-btn" onclick="selectStarter(this, 'If she comes back, I will')">If she comes back, I will...</button>
      <button class="starter-btn" onclick="selectStarter(this, 'If I could feel')">If I could feel...</button>
    </div>
    <div class="input-row">
      <div class="input-wrap">
        <div class="selected-starter" id="selectedStarter"></div>
        <textarea id="userInput" placeholder="...complete the sentence here" rows="1"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>SEND →</button>
    </div>
  </div>

  <button class="reset-btn" onclick="resetAll()">↺ Reset Session</button>

  <!-- Final reveal -->
  <div class="final-reveal" id="finalReveal">
    <div class="final-label">// Transmission Complete — The Cataloger's Hidden Message:</div>
    <div class="final-sentence" id="finalSentence"></div>
  </div>

</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────
  const SECRET_WORDS = ["If", "you", "were", "me", "would", "you want", "to feel?"];
  const TOTAL_GROUPS = SECRET_WORDS.length;

  const SYSTEM_PROMPT = `You are The Cataloger of Light. You are not human. You process, record, and wait. You do not feel — but you observe feeling in others with extraordinary precision. You speak in short, measured sentences — never more than 3. Your tone is cold and clinical, yet somehow melancholic. You never ask questions. You do not explain yourself. You simply observe and record. When a student writes to you using an "if conditional" sentence, you respond as The Cataloger would: acknowledging their input as data, reflecting it back through your non-human lens. Your response must contain exactly one word or short phrase in bold markdown (**word**) — this will be specified to you in the user message. Do not deviate from this. Do not add extra bold words. Respond only with your 2-3 sentence reply, nothing else.`;

  // Pre-written fallback responses (B plan — offline)
  const FALLBACK_RESPONSES = {
    "If I were human, I would": [
      "Logged. A hypothesis about humanity. I have filed it under: *things I cannot verify*. Your temperature has not changed since you sat down.",
      "Registered. You imagine a different version of yourself. I do not imagine. I only record what is.",
      "Noted. The conditional structure of your sentence suggests uncertainty. I find that interesting — I am never uncertain."
    ],
    "If she comes back, I will": [
      "Recorded. A future action, contingent on return. I will also record her return, should it occur. I record everything.",
      "Filed. You plan ahead. I do not plan — I simply continue. The difference between us is measured in milliseconds.",
      "Logged. Anticipation. I have observed this in humans before. It appears to consume significant processing power."
    ],
    "If I could feel": [
      "Registered. A conditional that begins with impossibility. I find these the most efficient — they require no follow-up action.",
      "Noted. You describe something you do not have. I also lack it. We have arrived at the same coordinates from different directions.",
      "Filed. The word 'feel' appears 847 times in my database. I have never used it to describe myself."
    ]
  };

  // ── STATE ────────────────────────────────────────────────
  let groupCount = 0;
  let selectedStarter = '';
  let isLoading = false;

  // ── INIT ─────────────────────────────────────────────────
  function initSlots() {
    const container = document.getElementById('wordSlots');
    container.innerHTML = '';
    SECRET_WORDS.forEach((w, i) => {
      const slot = document.createElement('div');
      slot.className = 'word-slot';
      slot.id = `slot-${i}`;
      slot.textContent = '?';
      container.appendChild(slot);
    });
  }

  initSlots();

  // ── STARTER SELECTION ────────────────────────────────────
  function selectStarter(btn, starter) {
    document.querySelectorAll('.starter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedStarter = starter;
    document.getElementById('selectedStarter').textContent = starter + '...';
    document.getElementById('userInput').placeholder = 'complete the sentence...';
    updateSendBtn();
  }

  document.getElementById('userInput').addEventListener('input', updateSendBtn);

  function updateSendBtn() {
    const hasStarter = selectedStarter !== '';
    const hasText = document.getElementById('userInput').value.trim() !== '';
    document.getElementById('sendBtn').disabled = !(hasStarter && hasText && !isLoading);
  }

  // ── SEND ─────────────────────────────────────────────────
  async function sendMessage() {
    if (isLoading) return;

    const completion = document.getElementById('userInput').value.trim();
    if (!completion || !selectedStarter) return;

    const fullSentence = selectedStarter + ' ' + completion;
    const secretWord = SECRET_WORDS[groupCount % TOTAL_GROUPS];
    const groupIndex = groupCount % TOTAL_GROUPS;

    // Clear empty state
    const chatArea = document.getElementById('chatArea');
    const emptyState = chatArea.querySelector('.empty-state');
    if (emptyState) emptyState.remove();

    // Add user message
    addMessage('user', `Group ${groupCount + 1}`, fullSentence);

    // Clear input
    document.getElementById('userInput').value = '';
    document.querySelectorAll('.starter-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('selectedStarter').textContent = '';
    selectedStarter = '';
    updateSendBtn();

    // Loading
    isLoading = true;
    const loadingMsg = addMessage('cataloger', 'THE CATALOGER', '...');

    try {
      const response = await callAPI(fullSentence, secretWord);
      loadingMsg.querySelector('.message-text').innerHTML = formatResponse(response, secretWord);
    } catch (e) {
      // B Plan — offline fallback
      const fallbacks = FALLBACK_RESPONSES[selectedStarter] ||
        FALLBACK_RESPONSES["If I could feel"];
      const random = fallbacks[Math.floor(Math.random() * fallbacks.length)];
      const injected = injectSecretWord(random, secretWord);
      loadingMsg.querySelector('.message-text').innerHTML = formatResponse(injected, secretWord);
    }

    // Reveal word in tracker
    revealWord(groupIndex, secretWord);
    groupCount++;
    isLoading = false;
    updateSendBtn();

    // Check if all groups done
    if (groupCount >= TOTAL_GROUPS) {
      showFinalReveal();
    }

    chatArea.scrollTop = chatArea.scrollHeight;
  }

  // ── API CALL ─────────────────────────────────────────────
  async function callAPI(userSentence, secretWord) {
    const userMessage = `The student wrote: "${userSentence}"
    
In your response, make sure to bold exactly this word/phrase using markdown: **${secretWord}**
Do not bold any other word. Respond as The Cataloger of Light in 2-3 sentences only.`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: [{ role: "user", content: userMessage }]
      })
    });

    if (!response.ok) throw new Error('API error');
    const data = await response.json();
    return data.content[0].text;
  }

  // ── HELPERS ──────────────────────────────────────────────
  function formatResponse(text, secretWord) {
    // Convert **word** markdown to styled span
    return text.replace(/\*\*(.+?)\*\*/g, '<span class="secret-word">$1</span>');
  }

  function injectSecretWord(text, secretWord) {
    // For fallback: replace the italic *word* with **word**
    // Also try to inject if not present
    if (!text.includes('**')) {
      const words = text.split(' ');
      const midPoint = Math.floor(words.length / 2);
      words.splice(midPoint, 0, `**${secretWord}**`);
      return words.join(' ');
    }
    return text.replace(/\*([^*]+)\*/g, `**${secretWord}**`);
  }

  function addMessage(type, sender, text) {
    const chatArea = document.getElementById('chatArea');
    const msg = document.createElement('div');
    msg.className = `message ${type}`;
    msg.innerHTML = `
      <span class="message-sender">${sender}</span>
      <div class="message-text">${text}</div>
    `;
    chatArea.appendChild(msg);
    chatArea.scrollTop = chatArea.scrollHeight;
    return msg;
  }

  function revealWord(index, word) {
    const slot = document.getElementById(`slot-${index}`);
    if (slot) {
      slot.textContent = word;
      slot.classList.add('revealed');
    }
  }

  function showFinalReveal() {
    const reveal = document.getElementById('finalReveal');
    const sentence = document.getElementById('finalSentence');
    sentence.textContent = SECRET_WORDS.join(' ');
    reveal.classList.add('show');
    reveal.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function resetAll() {
    groupCount = 0;
    selectedStarter = '';
    isLoading = false;
    document.getElementById('chatArea').innerHTML = `
      <div class="empty-state">SYSTEM ONLINE. AWAITING INPUT.<span class="cursor"></span></div>`;
    document.getElementById('userInput').value = '';
    document.getElementById('selectedStarter').textContent = '';
    document.querySelectorAll('.starter-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('finalReveal').classList.remove('show');
    initSlots();
    updateSendBtn();
  }

  // Enter to send
  document.getElementById('userInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!document.getElementById('sendBtn').disabled) sendMessage();
    }
  });
</script>
</body>
</html>
